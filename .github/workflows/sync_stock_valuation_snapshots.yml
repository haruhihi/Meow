name: Sync stock valuation snapshots

on:
  schedule:
    - cron: '20 21 * * 6'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional stock symbols, separated by spaces. When empty, the default is all listed A shares.'
        required: false
        default: ''
      start_date:
        description: 'Start date in YYYYMMDD. Default keeps the post-2015 crash valuation window.'
        required: false
        default: '20150101'
      end_date:
        description: 'Optional end date in YYYYMMDD. Empty means today.'
        required: false
        default: ''
      all_a_share:
        description: 'Sync all listed A shares from Tushare stock_basic. Set false only for held symbols plus configured watchlist.'
        required: false
        default: 'true'
      limit:
        description: 'Optional max symbols for test runs.'
        required: false
        default: '0'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Check secrets
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: |
          if [ -z "$DATABASE" ]; then
            echo "Missing GitHub secret: DATABASE"
            echo "Add it in Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Check Tushare token
        id: tushare-token
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: node scripts/check-tushare-token.mjs

      - name: Install dependencies
        if: steps.tushare-token.outputs.valid == 'true'
        env:
          DATABASE: ${{ secrets.DATABASE }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          printf 'DATABASE=%s\n' "$DATABASE" >> .env
          printf 'TUSHARE_TOKEN=%s\n' "$TUSHARE_TOKEN" >> .env
          npm install

      - name: Deploy database migrations
        if: steps.tushare-token.outputs.valid == 'true'
        run: node scripts/with-database-url.mjs prisma migrate deploy

      - name: Sync valuation snapshots
        if: steps.tushare-token.outputs.valid == 'true'
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          ALL_A_SHARE: ${{ github.event.inputs.all_a_share }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          args=(--start-date "${START_DATE:-20150101}" --sleep 300)
          if [ -n "$END_DATE" ]; then
            args+=(--end-date "$END_DATE")
          fi
          if [ -z "$SYMBOLS" ] && [ "${ALL_A_SHARE:-true}" = "true" ]; then
            args+=(--all-a-share)
          fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            args+=(--limit "$LIMIT")
          fi
          if [ -n "$SYMBOLS" ]; then
            args+=(--symbols $SYMBOLS)
          fi
          node scripts/sync-stock-valuation-snapshots.mjs "${args[@]}"