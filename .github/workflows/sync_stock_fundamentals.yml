name: Sync stock fundamentals

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Check database secret
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: |
          if [ -z "$DATABASE" ]; then
            echo "Missing GitHub secret: DATABASE"
            echo "Add it in Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Install dependencies
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: |
          printf 'DATABASE=%s\n' "$DATABASE" >> .env
          npm install

      - name: Sync fundamentals
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: node scripts/sync-stock-fundamentals.mjs
