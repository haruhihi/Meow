name: Sync stock fundamentals

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-stock-sync.txt

      - name: Install dependencies
        run: pip install -r requirements-stock-sync.txt

      - name: Check database secret
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: |
          if [ -z "$DATABASE" ]; then
            echo "Missing GitHub secret: DATABASE"
            echo "Add it in Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Sync fundamentals
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: python scripts/sync-stock-fundamentals.py
