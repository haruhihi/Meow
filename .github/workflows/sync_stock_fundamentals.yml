name: Sync stock fundamentals

on:
  schedule:
    - cron: '10 19 * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional stock symbols, separated by spaces. Empty means all held symbols.'
        required: false
        default: ''
      statement_count:
        description: 'Raw statement rows to fetch from Xueqiu type=all.'
        required: false
        default: '40'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Check database secret
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: |
          if [ -z "$DATABASE" ]; then
            echo "Missing GitHub secret: DATABASE"
            echo "Add it in Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Install dependencies
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: |
          printf 'DATABASE=%s\n' "$DATABASE" >> .env
          npm install

      - name: Sync fundamentals
        env:
          DATABASE: ${{ secrets.DATABASE }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
          STATEMENT_COUNT: ${{ github.event.inputs.statement_count }}
        run: |
          args=(--sleep 1500 --statement-count "${STATEMENT_COUNT:-40}")
          if [ -n "$SYMBOLS" ]; then
            args+=(--symbols $SYMBOLS)
          fi
          node scripts/sync-stock-fundamentals.mjs "${args[@]}"
