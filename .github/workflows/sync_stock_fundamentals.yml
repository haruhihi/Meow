name: Sync stock fundamentals

on:
  schedule:
    - cron: '10 19 * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional stock symbols, separated by spaces. Empty means held symbols plus configured watchlist.'
        required: false
        default: ''
      start_date:
        description: 'Tushare financial statement start date in YYYYMMDD.'
        required: false
        default: '20120101'
      replace_source:
        description: 'Delete old non-Tushare fundamentals/statements for each successfully fetched symbol.'
        required: false
        default: 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Check database secret
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: |
          if [ -z "$DATABASE" ]; then
            echo "Missing GitHub secret: DATABASE"
            echo "Add it in Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Check Tushare token
        id: tushare-token
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: node scripts/check-tushare-token.mjs

      - name: Install dependencies
        if: steps.tushare-token.outputs.valid == 'true'
        env:
          DATABASE: ${{ secrets.DATABASE }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          printf 'DATABASE=%s\n' "$DATABASE" >> .env
          printf 'TUSHARE_TOKEN=%s\n' "$TUSHARE_TOKEN" >> .env
          npm install

      - name: Sync fundamentals
        if: steps.tushare-token.outputs.valid == 'true'
        env:
          DATABASE: ${{ secrets.DATABASE }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
          START_DATE: ${{ github.event.inputs.start_date }}
          REPLACE_SOURCE: ${{ github.event.inputs.replace_source }}
        run: |
          args=(--sleep 300 --start-date "${START_DATE:-20120101}")
          if [ "${REPLACE_SOURCE:-true}" = "true" ]; then
            args+=(--replace-source)
          fi
          if [ -n "$SYMBOLS" ]; then
            args+=(--symbols $SYMBOLS)
          fi
          node scripts/sync-stock-fundamentals.mjs "${args[@]}"
